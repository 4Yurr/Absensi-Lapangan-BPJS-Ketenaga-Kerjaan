<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Website Absensi Kegiatan Lapangan untuk Mahasiswa / Peserta Magang BPJS Kesehatan. Peta GPS dinamis, foto kamera langsung, dan pencatatan otomatis." />
  <meta name="theme-color" content="#080e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Absensi Kegiatan Lapangan</title>

  <!-- Leaflet CSS (local file for max reliability) -->
  <link rel="stylesheet" href="css/leaflet.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================================================
       HEADER
  ==================================================== -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="header-icon-box" aria-hidden="true">
        <svg class="icon-header" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </div>
      <div>
        <h1 class="header-title">Absensi BPJS Ketenagakerjaan</h1>
      </div>
    </div>
  </header>

  <!-- ===================================================
       MAIN CONTENT
  ==================================================== -->
  <main class="main-container" role="main">

    <!-- ─── STEP 1: IDENTITAS ─── -->
    <section class="card" id="section-identity" aria-labelledby="title-identity">
      <div class="card-header">
        <span class="step-badge" aria-hidden="true">1</span>
        <h2 class="card-title" id="title-identity">Identitas Anda</h2>
      </div>

      <!-- NIM — with datalist for autocomplete from tab "Nama" -->
      <div class="form-group">
        <label class="form-label" for="inputNIM">
          NIM <span class="required" aria-label="wajib diisi">*</span>
        </label>
        <input
          type="text"
          id="inputNIM"
          class="form-input"
          placeholder="Masukkan atau pilih NIM Anda"
          inputmode="numeric"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          maxlength="20"
          list="nimList"
          aria-describedby="nimHelp"
        />
        <datalist id="nimList">
          <!-- Options will be populated by app.js from tab "Nama" -->
        </datalist>
        <small id="nimHelp" class="form-hint hidden"></small>
      </div>

      <!-- Nama — READ-ONLY, auto-filled from tab "Nama" lookup -->
      <div class="form-group">
        <label class="form-label" for="inputNama">
          Nama Lengkap <span class="required" aria-label="wajib diisi">*</span>
        </label>
        <input
          type="text"
          id="inputNama"
          class="form-input input-readonly"
          placeholder="Nama terisi otomatis setelah NIM valid"
          readonly
          tabindex="-1"
        />
      </div>
    </section>

    <!-- ─── STEP 2: LOKASI ─── -->
    <section class="card" id="section-location" aria-labelledby="title-location">
      <div class="card-header">
        <span class="step-badge" aria-hidden="true">2</span>
        <h2 class="card-title" id="title-location">Lokasi Kegiatan</h2>
      </div>

      <button type="button" id="btnGetLocation" class="btn btn-secondary" aria-live="polite">
        <svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <span id="btnGetLocationText">Ambil Lokasi Saya</span>
      </button>

      <!-- Status Lokasi -->
      <div id="locationStatus" class="location-status hidden" role="status" aria-live="polite"></div>

      <!-- Peta Leaflet (Read-Only) -->
      <div id="mapWrapper" class="map-wrapper hidden" aria-label="Peta posisi Anda (hanya baca)">
        <div id="map" aria-hidden="true"></div>
      </div>

      <!-- Tampilan Alamat Reverse Geocoding -->
      <div id="addressCard" class="address-card hidden" aria-live="polite">
        <div class="address-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="address-content">
          <p class="address-label">Lokasi Terdeteksi</p>
          <p id="addressText" class="address-text">Mendeteksi alamat...</p>
          <div class="coords-display" aria-label="Koordinat GPS">
            <span id="latDisplay">Lat: —</span>
            <span id="lonDisplay">Long: —</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ─── STEP 3: FOTO ─── -->
    <section class="card" id="section-photo" aria-labelledby="title-photo">
      <div class="card-header">
        <span class="step-badge" aria-hidden="true">3</span>
        <h2 class="card-title" id="title-photo">Foto Kegiatan</h2>
      </div>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        capture="environment"
        class="photo-input-hidden"
        aria-label="Ambil foto kegiatan dengan kamera"
      />

      <button type="button" id="btnTakePhoto" class="btn btn-secondary">
        <svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span id="btnTakePhotoText">Ambil Foto</span>
      </button>

      <!-- Preview Foto -->
      <div id="photoPreviewWrapper" class="photo-preview-wrapper hidden">
        <div class="photo-preview-label">
          <span class="photo-ok-badge" aria-hidden="true">✓</span>
        </div>
        <img
          id="photoPreview"
          class="photo-preview"
          src=""
          alt="Preview foto kegiatan yang diambil"
        />
        <button type="button" id="btnChangePhoto" class="btn-text-sm">
          Ambil Ulang Foto
        </button>
      </div>
    </section>

    <!-- ─── STEP 4: SUBMIT ─── -->
    <section class="card card-submit" id="section-submit" aria-labelledby="title-submit">
      <button type="button" id="btnSubmit" class="btn btn-primary" aria-label="Kirim data absensi">
        <svg class="btn-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        <span id="btnSubmitText">Kirim Absensi</span>
      </button>
    </section>

  </main>

  <!-- ===================================================
       MODAL OVERLAY — Feedback Sukses / Error
  ==================================================== -->
  <div
    id="modalOverlay"
    class="modal-overlay hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalMessage"
  >
    <div class="modal-card">
      <div id="modalIcon" class="modal-icon" aria-hidden="true"></div>
      <h2 id="modalTitle" class="modal-title">Judul Modal</h2>
      <p id="modalMessage" class="modal-message">Pesan modal.</p>
      <div id="modalDetail" class="modal-detail hidden" aria-label="Detail absensi"></div>
      <button type="button" id="modalBtn" class="btn btn-primary modal-btn">
        Tutup
      </button>
    </div>
  </div>

  <!-- ===================================================
       LOADING OVERLAY
  ==================================================== -->
  <div id="loadingOverlay" class="loading-overlay hidden" role="status" aria-live="assertive">
    <div class="loading-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText" class="loading-text">Mengirim data absensi...</p>
      <p class="loading-sub">Harap tunggu, jangan tutup halaman ini.</p>
    </div>
  </div>

  <!-- ===================================================
       SCRIPTS
  ==================================================== -->
  <!-- Leaflet JS (local file for max reliability) -->
  <script src="js/leaflet.js"></script>
  <!-- App Modules (order matters) -->
  <script src="js/map.js"></script>
  <script src="js/location.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
